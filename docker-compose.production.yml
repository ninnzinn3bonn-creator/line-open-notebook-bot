services:
  surrealdb:
    ports: !reset []
    restart: always

  open-notebook:
    ports: !reset []
    environment:
      API_URL: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?Set OPEN_NOTEBOOK_PASSWORD in .env}
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "1"
    restart: always

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    environment:
      BRIDGE_PORT: "3001"
      SQLITE_PATH: /app/data/queue.db
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-mock}
      MOCK_ANSWER_DELAY_MS: ${MOCK_ANSWER_DELAY_MS:-10}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-250}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-120000}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      RETRY_DELAY_MS: ${RETRY_DELAY_MS:-2000}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      LINE_REPLY_CUTOFF_MS: ${LINE_REPLY_CUTOFF_MS:-45000}
      LINE_SEND_TIMEOUT_MS: ${LINE_SEND_TIMEOUT_MS:-10000}
      EMERGENCY_ANSWER_TEXT: ${EMERGENCY_ANSWER_TEXT:-申し訳ございません。ただいま回答を取得できませんでした。お急ぎの場合は店舗へ直接お問い合わせいただくか、時間をおいてもう一度お試しください。}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?Set LINE_CHANNEL_SECRET in .env}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?Set LINE_CHANNEL_ACCESS_TOKEN in .env}
      OPEN_NOTEBOOK_BASE_URL: http://open-notebook:5055
    volumes:
      - bridge_data:/app/data
    depends_on:
      open-notebook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bridge:
        condition: service_healthy
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bridge_data:
  caddy_data:
  caddy_config:
