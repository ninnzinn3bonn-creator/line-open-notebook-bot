services:
  surrealdb:
    image: ${SURREALDB_IMAGE:-surrealdb/surrealdb:v2@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011}
    command:
      - start
      - --log
      - info
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASSWORD:?Set SURREAL_PASSWORD in .env}
      - rocksdb:/mydata/mydatabase.db
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: "true"
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  open-notebook:
    image: ${OPEN_NOTEBOOK_IMAGE:-lfnovo/open_notebook:1.14.0@sha256:e53f90d6153fcf4a64604d9a0c12cb0428a32cfb8dbcbb72e81ab12c013ee330}
    ports:
      - "127.0.0.1:8502:8502"
      - "127.0.0.1:5055:5055"
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:?Set OPEN_NOTEBOOK_ENCRYPTION_KEY in .env}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:?Set SURREAL_PASSWORD in .env}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      CORS_ORIGINS: http://localhost:8502
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "2"
    volumes:
      - ./notebook_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: unless-stopped
