services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command:
      - start
      - --log
      - info
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASSWORD:?Set SURREAL_PASSWORD in .env}
      - rocksdb:/mydata/mydatabase.db
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: "true"
    restart: unless-stopped

  open-notebook:
    image: lfnovo/open_notebook:${OPEN_NOTEBOOK_VERSION:-1.14.0}
    ports:
      - "127.0.0.1:8502:8502"
      - "127.0.0.1:5055:5055"
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:?Set OPEN_NOTEBOOK_ENCRYPTION_KEY in .env}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:?Set SURREAL_PASSWORD in .env}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      CORS_ORIGINS: http://localhost:8502
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "2"
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      - surrealdb
    restart: unless-stopped

